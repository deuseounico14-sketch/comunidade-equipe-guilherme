.box{width:100%;max-width:380px;background:rgba(18,21,29,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:13px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(255,176,32,.16);color:var(--gold);text-transform:uppercase;letter-spacing:.05em}.tag.m{background:rgba(61,220,151,.14);color:var(--ok)}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.5}.t{color:var(--mut);font-size:12px}
